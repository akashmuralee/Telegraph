<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegraph — Morse Typing Test</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0e0e0d;
            --surface: #1a1a18;
            --surface2: #222220;
            --border: #2e2e2b;
            --border2: #3a3a37;
            --accent: #e8a825;
            --accent-glow: rgba(232, 168, 37, 0.18);
            --accent-dim: rgba(232, 168, 37, 0.08);
            --correct: #f0efe8;
            --incorrect: #ca4754;
            --pending: #4a4a45;
            --text: #f0efe8;
            --text2: #a0a099;
            --text3: #555550;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .app { width: 100%; max-width: 720px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .logo {
            font-family: var(--sans);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text3);
        }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .stat-pill {
            display: flex;
            align-items: baseline;
            gap: 5px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 4px 12px;
        }
        .stat-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--accent);
            line-height: 1;
            min-width: 14px;
            text-align: right;
        }
        .stat-label {
            font-size: 10px;
            letter-spacing: 0.12em;
            color: var(--text3);
            text-transform: uppercase;
        }

        .settings-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.3s;
            outline: none;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .settings-btn:hover { border-color: var(--border2); color: var(--text2); }
        .settings-btn:active { background: var(--surface2); }
        .settings-btn.open { border-color: var(--accent); color: var(--accent); transform: rotate(60deg); }
        .settings-btn svg { width: 14px; height: 14px; }

        /* ── Mode toolbar ── */
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .seg-group {
            display: inline-flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 3px;
            gap: 2px;
        }
        .seg {
            background: transparent;
            border: none;
            color: var(--text3);
            font-family: var(--mono);
            font-size: 11px;
            padding: 5px 14px;
            border-radius: 100px;
            cursor: pointer;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            transition: color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .seg:hover { color: var(--text); }
        .seg.active {
            background: var(--accent-dim);
            color: var(--accent);
        }

        /* ── Settings drawer ── */
        .settings-drawer {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin-bottom 0.35s;
            margin-bottom: 0;
        }
        .settings-drawer.open { max-height: 520px; opacity: 1; margin-bottom: 1.25rem; }

        .settings-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.125rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .settings-title {
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text3);
        }

        .slider-row { display: flex; flex-direction: column; gap: 6px; }
        .slider-header { display: flex; justify-content: space-between; align-items: baseline; }
        .slider-label { font-size: 12px; color: var(--text2); }
        .slider-value { font-size: 11px; color: var(--accent); min-width: 44px; text-align: right; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: var(--border2);
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.25); }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
        }

        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .chip-group { display: flex; gap: 4px; flex-wrap: wrap; }
        .chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            font-family: var(--mono);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 100px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .chip:hover { border-color: var(--border2); color: var(--text); }
        .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

        /* ── Test panel ── */
        .test-panel { position: relative; }

        /* Writing mode: words */
        .words-wrap {
            font-size: 24px;
            line-height: 1.7;
            letter-spacing: 0.04em;
            color: var(--pending);
            min-height: calc(1.7em * 3);
            max-height: calc(1.7em * 3);
            overflow: hidden;
            position: relative;
        }
        .word {
            display: inline-block;
            margin-right: 0.55em;
            white-space: nowrap;
            vertical-align: top;
        }
        .char {
            position: relative;
            display: inline-block;
        }
        .char.correct   { color: var(--correct); }
        .char.incorrect { color: var(--incorrect); }
        .char.extra     { color: var(--incorrect); opacity: 0.7; }

        /* a zero-width "end" marker so the caret can sit past the last char */
        .end {
            position: relative;
            display: inline-block;
            width: 1px;
            vertical-align: baseline;
        }

        /* caret sits to the LEFT of the current char (or end marker) */
        .current::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 0.18em;
            height: 1em;
            width: 2px;
            background: var(--accent);
            border-radius: 1px;
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ── Reading mode: morse waves ── */
        .rwords-wrap {
            display: flex;
            flex-wrap: wrap;
            row-gap: 1.25rem;
            column-gap: 1.5rem;
            min-height: 150px;
            max-height: 240px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 2px;
            scrollbar-width: none;
        }
        .rwords-wrap::-webkit-scrollbar { display: none; }

        .rword {
            display: inline-flex;
            gap: 4px;
        }
        .rchar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 6px 6px;
            border-radius: 10px;
            transition: background 0.12s, transform 0.12s;
        }
        .rchar.current {
            background: var(--accent-dim);
            box-shadow: inset 0 0 0 1px var(--accent);
        }
        .rwave {
            display: block;
            line-height: 0;
            color: var(--text2);
            opacity: 0.6;
            transition: color 0.12s, opacity 0.12s;
        }
        .rchar.current   .rwave { color: var(--accent);   opacity: 1; }
        .rchar.correct   .rwave { color: var(--correct);  opacity: 0.4; }
        .rchar.incorrect .rwave { color: var(--incorrect); opacity: 0.55; }
        .rwave svg { display: block; overflow: visible; }
        .rwave path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
        }
        .rwave path.bg {
            stroke: currentColor;
            stroke-width: 1.5;
        }
        .rwave path.fg {
            stroke: var(--accent);
            stroke-width: 2;
            stroke-dasharray: var(--len, 0);
            stroke-dashoffset: var(--len, 0);
            opacity: 0;
        }
        .rchar.playing .rwave path.fg { opacity: 1; }
        .rchar.playing { background: var(--accent-dim); }
        .rchar.current .rwave path.bg { stroke-width: 1.75; }

        .rletter {
            font-size: 15px;
            color: var(--pending);
            min-height: 1.1em;
            line-height: 1;
            text-transform: lowercase;
        }
        .rchar.correct   .rletter { color: var(--correct); }
        .rchar.incorrect .rletter { color: var(--incorrect); }

        /* ── Symbol bar (writing mode) ── */
        .symbol-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 26px;
            margin-top: 1.25rem;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
        }
        .sym-label {
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text3);
        }
        #symbol-row {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-height: 8px;
        }
        .sym-pip {
            border-radius: 100px;
            background: var(--accent);
            flex-shrink: 0;
            animation: pip-in 0.07s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sym-pip.dot  { width: 7px; height: 7px; }
        .sym-pip.dash { width: 20px; height: 7px; }

        .expected-hint {
            font-size: 11px;
            color: var(--text3);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .expected-hint b { color: var(--accent); font-weight: 500; margin-left: 6px; }

        @keyframes pip-in {
            from { opacity: 0; transform: scale(0.4); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ── Controls (simplified) ── */
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 1.5rem 0 1.25rem;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            padding: 9px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text2);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .ctrl-btn:hover  { border-color: var(--border2); color: var(--text); }
        .ctrl-btn:active { background: var(--surface2); }
        .ctrl-btn svg { width: 13px; height: 13px; }

        /* ── Key button (writing mode only) ── */
        .key-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
        }
        .key-section.hidden { display: none; }

        .key-wrap { position: relative; width: 120px; height: 120px; }

        .key-orbit {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px dashed var(--border2);
            transition: border-color 0.12s, transform 0.12s;
        }
        .key-wrap.active .key-orbit {
            border-color: var(--accent);
            border-style: solid;
            transform: scale(1.06);
        }

        .key-btn {
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.08s, border-color 0.08s, transform 0.08s, box-shadow 0.08s;
            -webkit-tap-highlight-color: transparent;
        }
        .key-wrap.active .key-btn {
            background: var(--accent-dim);
            border-color: var(--accent);
            transform: scale(0.94);
            box-shadow: 0 0 0 8px var(--accent-glow);
        }

        .key-center { display: flex; gap: 4px; }
        .key-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--border2);
            transition: background 0.1s, transform 0.1s;
        }
        .key-wrap.active .key-dot { background: var(--accent); }
        .key-wrap.active .key-dot:nth-child(2) { transform: scale(1.4); }

        .key-hint {
            font-size: 11px;
            color: var(--text3);
            letter-spacing: 0.06em;
            text-align: center;
            line-height: 1.6;
        }

        /* ── Word progress bar (reading mode) ── */
        .progress-wrap {
            margin-top: 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--surface2);
            border-radius: 100px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 100px;
            transition: width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-fill.reset {
            transition: none;
        }
        .progress-count {
            font-size: 11px;
            color: var(--text3);
            letter-spacing: 0.06em;
            min-width: 56px;
            text-align: right;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
        .icon-btn:active { background: var(--surface2); }
        .icon-btn svg { width: 14px; height: 14px; }
        .icon-btn.playing { color: var(--accent); border-color: var(--accent); }

        /* ── Reading mode hint ── */
        .read-hint {
            text-align: center;
            color: var(--text3);
            font-size: 12px;
            letter-spacing: 0.04em;
            margin-top: 0.5rem;
        }
        .read-hint.hidden { display: none; }
        .read-hint b { color: var(--text); font-weight: 500; }

        kbd {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text2);
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 1px 5px;
        }

        /* ── Results ── */
        .results {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem 1.5rem;
            margin-top: 1rem;
        }
        .results.show { display: block; }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }
        .result-cell { display: flex; flex-direction: column; gap: 4px; }
        .result-num {
            font-size: 30px;
            color: var(--accent);
            font-weight: 400;
            line-height: 1;
        }
        .result-num small { font-size: 14px; color: var(--text3); }
        .result-key {
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text3);
        }

        .test-panel.finished .words-wrap,
        .test-panel.finished .rwords-wrap,
        .test-panel.finished .symbol-bar { display: none; }

        body[data-mode="writing"] .rwords-wrap,
        body[data-mode="writing"] .read-hint,
        body[data-mode="writing"] .progress-wrap { display: none; }

        body[data-mode="reading"] .words-wrap,
        body[data-mode="reading"] .symbol-bar,
        body[data-mode="reading"] .key-section { display: none; }

        @media (max-width: 540px) {
            .words-wrap { font-size: 19px; }
            .results-grid { grid-template-columns: repeat(2, 1fr); }
            .result-num { font-size: 24px; }
            .header-right .stat-pill:nth-of-type(2) { display: none; }
        }
    </style>
</head>
<body data-mode="writing">
<div class="app">

    <header class="header">
        <span class="logo">Telegraph</span>
        <div class="header-right">
            <div class="stat-pill">
                <span class="stat-value" id="wpm-display">0</span>
                <span class="stat-label">wpm</span>
            </div>
            <div class="stat-pill">
                <span class="stat-value" id="acc-display">100</span>
                <span class="stat-label">acc</span>
            </div>
            <button class="settings-btn" id="settings-btn" aria-label="Settings" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Mode toolbar -->
    <div class="toolbar">
        <div class="seg-group" id="mode-group" role="tablist" aria-label="Mode">
            <button class="seg active" data-mode="writing" role="tab">writing</button>
            <button class="seg" data-mode="reading" role="tab">reading</button>
        </div>
    </div>

    <!-- Settings drawer -->
    <div class="settings-drawer" id="settings-drawer" aria-hidden="true">
        <div class="settings-card">

            <div class="option-row">
                <span class="settings-title">Words</span>
                <div class="chip-group" id="length-group">
                    <button class="chip" data-len="15">15</button>
                    <button class="chip active" data-len="25">25</button>
                    <button class="chip" data-len="50">50</button>
                    <button class="chip" data-len="100">100</button>
                </div>
            </div>

            <div class="option-row" id="hint-row">
                <span class="settings-title">Show morse</span>
                <div class="chip-group" id="hint-group">
                    <button class="chip active" data-hint="on">on</button>
                    <button class="chip" data-hint="off">off</button>
                </div>
            </div>

            <div class="settings-title" style="margin-top: 4px;">Speed</div>

            <div class="slider-row">
                <div class="slider-header">
                    <span class="slider-label">Tap length</span>
                    <span class="slider-value" id="dot-val">120 ms</span>
                </div>
                <input type="range" id="dot-slider" min="50" max="300" step="10" value="120">
            </div>

            <div class="slider-row">
                <div class="slider-header">
                    <span class="slider-label">Pause between letters</span>
                    <span class="slider-value" id="char-val">360 ms</span>
                </div>
                <input type="range" id="char-slider" min="100" max="800" step="20" value="360">
            </div>

            <div class="slider-row">
                <div class="slider-header">
                    <span class="slider-label">Pause between words</span>
                    <span class="slider-value" id="word-val">840 ms</span>
                </div>
                <input type="range" id="word-slider" min="300" max="2000" step="50" value="840">
            </div>
        </div>
    </div>

    <div class="test-panel" id="test-panel">
        <!-- WRITING mode: words to type via morse -->
        <div class="words-wrap" id="words-wrap"></div>

        <!-- READING mode: morse waves to read; type letters on keyboard -->
        <div class="rwords-wrap" id="rwords-wrap"></div>

        <div class="symbol-bar">
            <span class="sym-label">Now</span>
            <div id="symbol-row"></div>
            <span class="expected-hint" id="expected-hint"></span>
        </div>

        <div class="progress-wrap" id="progress-wrap">
            <button class="icon-btn" id="replay-btn" aria-label="Replay sound" title="Replay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            </button>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <span class="progress-count" id="progress-count">0 / 0</span>
        </div>

        <p class="read-hint" id="read-hint">listen to the morse and type the letter on your keyboard</p>

        <div class="results" id="results">
            <div class="results-grid">
                <div class="result-cell">
                    <span class="result-num" id="r-wpm">0</span>
                    <span class="result-key">wpm</span>
                </div>
                <div class="result-cell">
                    <span class="result-num" id="r-acc">0<small>%</small></span>
                    <span class="result-key">accuracy</span>
                </div>
                <div class="result-cell">
                    <span class="result-num" id="r-time">0<small>s</small></span>
                    <span class="result-key">time</span>
                </div>
                <div class="result-cell">
                    <span class="result-num" id="r-chars">0</span>
                    <span class="result-key">chars</span>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-row">
        <button class="ctrl-btn" id="restart-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            new test
        </button>
        <button class="ctrl-btn" id="backspace-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
            delete
        </button>
    </div>

    <!-- Telegraph key (writing mode) -->
    <div class="key-section" id="key-section">
        <div class="key-wrap" id="key-wrap">
            <div class="key-orbit"></div>
            <button class="key-btn" id="telegraph-btn" aria-label="Telegraph key">
                <div class="key-center">
                    <div class="key-dot"></div>
                    <div class="key-dot"></div>
                    <div class="key-dot"></div>
                </div>
            </button>
        </div>
        <p class="key-hint">tap the key · or hold <kbd>space</kbd><br>short = dot, long = dash</p>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
    let DOT_MS    = 120;
    let CHAR_SPACE = 360;
    let WORD_SPACE = 840;

    const MORSE = {
        '.-':'a','-...':'b','-.-.':'c','-..':'d','.':'e',
        '..-.':'f','--.':'g','....':'h','..':'i','.---':'j',
        '-.-':'k','.-..':'l','--':'m','-.':'n','---':'o',
        '.--.':'p','--.-':'q','.-.':'r','...':'s','-':'t',
        '..-':'u','...-':'v','.--':'w','-..-':'x','-.--':'y',
        '--..':'z'
    };
    const REVERSE_MORSE = Object.fromEntries(
        Object.entries(MORSE).map(([k, v]) => [v, k])
    );

    const WORD_POOL = [
        "the","of","to","and","a","in","is","it","you","that","he","was","for","on","are",
        "with","as","i","his","they","be","at","one","have","this","from","or","had","by",
        "not","but","what","all","were","when","we","there","can","an","your","which","their",
        "said","if","do","will","each","about","how","up","out","them","then","she","many",
        "some","so","these","would","other","into","has","more","her","two","like","him","see",
        "time","could","no","make","than","first","been","its","who","now","people","my","made",
        "over","did","down","only","way","find","use","may","water","long","little","very","after",
        "called","just","where","most","know","get","through","back","much","go","good","new",
        "write","our","me","man","too","any","day","same","right","look","think","also","around",
        "another","came","come","work","three","word","must","because","does","part","even","place",
        "well","such","here","take","why","help","put","away","again","off","went","old",
        "number","great","tell","men","say","small","every","found","still","name","should",
        "home","big","give","air","line","set","own","under","read","last","never","us","left","end",
        "while","might","next","sound","below","saw","both","few","those","always","show","large",
        "often","asked","house","world","going","want","school","until","form","food","keep","feet",
        "land","side","boy","once","life","took","four","head","above","kind","began","almost","live",
        "page","earth","need","far","hand","high","year","light","father","let","night","being",
        "study","second","soon","story","since","white","ever","paper","hard","near","better","best",
        "across","during","today"
    ];

    // ── DOM ──
    const wordsWrap     = document.getElementById('words-wrap');
    const rwordsWrap    = document.getElementById('rwords-wrap');
    const symbolRow     = document.getElementById('symbol-row');
    const expectedHint  = document.getElementById('expected-hint');
    const keyWrap       = document.getElementById('key-wrap');
    const keyBtn        = document.getElementById('telegraph-btn');
    const restartBtn    = document.getElementById('restart-btn');
    const backBtn       = document.getElementById('backspace-btn');
    const wpmDisplay    = document.getElementById('wpm-display');
    const accDisplay    = document.getElementById('acc-display');
    const settingsBtn   = document.getElementById('settings-btn');
    const settingsDrawer= document.getElementById('settings-drawer');
    const dotSlider     = document.getElementById('dot-slider');
    const charSlider    = document.getElementById('char-slider');
    const wordSlider    = document.getElementById('word-slider');
    const dotVal        = document.getElementById('dot-val');
    const charVal       = document.getElementById('char-val');
    const wordVal       = document.getElementById('word-val');
    const lengthGroup   = document.getElementById('length-group');
    const hintGroup     = document.getElementById('hint-group');
    const hintRow       = document.getElementById('hint-row');
    const modeGroup     = document.getElementById('mode-group');
    const testPanel     = document.getElementById('test-panel');
    const results       = document.getElementById('results');
    const replayBtn     = document.getElementById('replay-btn');
    const progressFill  = document.getElementById('progress-fill');
    const progressCount = document.getElementById('progress-count');

    // ── State ──
    let MODE = 'writing'; // 'writing' | 'reading'
    let WORD_COUNT = 25;
    let HINTS_ON = true;
    let words = [];
    let typed = [];
    let wordIdx = 0;
    let charIdx = 0;
    let correctChars = 0;
    let totalChars = 0;
    let finished = false;

    // Writing mode key state
    let audioReady = false, synth = null;
    let pressStart = 0, isPressed = false;
    let currentSeq = '';
    let spaceTimer = null;
    let wpmStart = null, wpmInterval = null;

    // ── Audio ──
    function initAudio() {
        if (audioReady) return;
        Tone.start().then(() => {
            audioReady = true;
            synth = new Tone.Synth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.008, decay: 0.1, sustain: 1, release: 0.04 }
            }).toDestination();
            synth.volume.value = -12;
        });
    }
    async function ensureAudio() {
        if (audioReady) return true;
        try {
            await Tone.start();
            if (!synth) {
                synth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.008, decay: 0.1, sustain: 1, release: 0.04 }
                }).toDestination();
                synth.volume.value = -12;
            }
            audioReady = true;
        } catch (e) { return false; }
        return audioReady;
    }
    const playBeep = () => synth && synth.triggerAttack(620);
    const stopBeep = () => synth && synth.triggerRelease();

    // ── Reading-mode playback (audio + wave sync) ──
    const PLAY_FREQ = 620;
    let playbackTimeouts = [];
    let playbackToken = 0;

    function stopPlayback() {
        playbackToken++;
        playbackTimeouts.forEach(h => clearTimeout(h));
        playbackTimeouts = [];
        if (synth) { try { synth.triggerRelease(); } catch (e) {} }
        rwordsWrap.querySelectorAll('.rchar.playing').forEach(c => c.classList.remove('playing'));
        rwordsWrap.querySelectorAll('.rwave path.fg').forEach(p => {
            p.style.transition = 'none';
            const len = p.style.getPropertyValue('--len') || '0';
            p.style.strokeDashoffset = len;
        });
        replayBtn.classList.remove('playing');
    }

    async function playWordAudio(wIdx) {
        if (finished || !words[wIdx]) return;
        const ok = await ensureAudio();
        if (!ok) return;
        if (MODE !== 'reading') return;

        stopPlayback();
        const token = ++playbackToken;
        replayBtn.classList.add('playing');

        const word = words[wIdx];
        const rwordEl = rwordsWrap.querySelectorAll('.rword')[wIdx];
        if (!rwordEl) return;

        // playback timing (independent of input speed sliders for clarity)
        const PLAY_DOT = 90;
        const PLAY_DASH = PLAY_DOT * 3;
        const PLAY_INTRA = PLAY_DOT;
        const PLAY_INTER = PLAY_DOT * 3;
        const START_OFFSET_MS = 60;
        const audioStart = Tone.now() + START_OFFSET_MS / 1000;

        let cumMs = 0;
        for (let ci = 0; ci < word.length; ci++) {
            const rchar = rwordEl.children[ci];
            const pattern = REVERSE_MORSE[word[ci]] || '';
            const charStartMs = cumMs;
            let charMs = 0;
            for (let pi = 0; pi < pattern.length; pi++) {
                if (pi > 0) charMs += PLAY_INTRA;
                const dur = pattern[pi] === '.' ? PLAY_DOT : PLAY_DASH;
                try {
                    synth.triggerAttackRelease(PLAY_FREQ, dur / 1000, audioStart + (charStartMs + charMs) / 1000);
                } catch (e) {}
                charMs += dur;
            }

            // Visual: draw the wave during this char's audio segment
            const startDelay = START_OFFSET_MS + charStartMs;
            const drawMs = charMs;
            playbackTimeouts.push(setTimeout(() => {
                if (token !== playbackToken) return;
                animateCharPlay(rchar, drawMs);
            }, startDelay));
            playbackTimeouts.push(setTimeout(() => {
                if (token !== playbackToken) return;
                endCharPlay(rchar);
            }, startDelay + drawMs + 60));

            cumMs += charMs + PLAY_INTER;
        }

        // After the whole word, drop the playing state on the button
        playbackTimeouts.push(setTimeout(() => {
            if (token !== playbackToken) return;
            replayBtn.classList.remove('playing');
        }, START_OFFSET_MS + cumMs));
    }

    function animateCharPlay(rchar, durMs) {
        if (!rchar) return;
        rchar.classList.add('playing');
        const fg = rchar.querySelector('.rwave path.fg');
        if (!fg) return;
        const len = fg.style.getPropertyValue('--len') || fg.getTotalLength();
        fg.style.transition = 'none';
        fg.style.strokeDashoffset = len;
        // reflow
        fg.getBoundingClientRect();
        requestAnimationFrame(() => {
            fg.style.transition = `stroke-dashoffset ${durMs}ms linear`;
            fg.style.strokeDashoffset = '0';
        });
    }

    function endCharPlay(rchar) {
        if (!rchar) return;
        rchar.classList.remove('playing');
        const fg = rchar.querySelector('.rwave path.fg');
        if (!fg) return;
        const len = fg.style.getPropertyValue('--len') || fg.getTotalLength();
        fg.style.transition = 'stroke-dashoffset 220ms ease-out';
        fg.style.strokeDashoffset = len;
    }

    // ── Words ──
    function pickWords(n) {
        const out = [];
        for (let i = 0; i < n; i++) {
            out.push(WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)]);
        }
        return out;
    }

    function buildTest() {
        stopPlayback();
        words = pickWords(WORD_COUNT);
        typed = words.map(() => '');
        wordIdx = 0;
        charIdx = 0;
        correctChars = 0;
        totalChars = 0;
        finished = false;
        currentSeq = '';
        if (spaceTimer) { clearTimeout(spaceTimer); spaceTimer = null; }
        resetWpm();
        wpmDisplay.textContent = '0';
        accDisplay.textContent = '100';
        results.classList.remove('show');
        testPanel.classList.remove('finished');
        render();
        // In reading mode, play the first word's audio once audio is unlocked
        if (MODE === 'reading' && audioReady) {
            playWordAudio(0);
        }
    }

    function render() {
        if (MODE === 'writing') {
            renderWords();
            renderSymbols();
            renderHint();
        } else {
            renderReadingWords();
        }
    }

    // ── Writing-mode render ──
    function renderWords() {
        wordsWrap.innerHTML = '';
        words.forEach((w, wi) => {
            const wEl = document.createElement('span');
            wEl.className = 'word';

            const typedW = typed[wi] || '';
            const maxLen = Math.max(w.length, typedW.length);

            for (let ci = 0; ci < maxLen; ci++) {
                const targetCh = w[ci];
                const typedCh = typedW[ci];

                const cEl = document.createElement('span');
                cEl.className = 'char';

                if (typedCh === undefined) {
                    cEl.textContent = targetCh;
                } else if (targetCh === undefined) {
                    cEl.textContent = typedCh;
                    cEl.classList.add('extra');
                } else {
                    cEl.textContent = targetCh;
                    cEl.classList.add(typedCh === targetCh ? 'correct' : 'incorrect');
                }
                if (wi === wordIdx && ci === charIdx && !finished) {
                    cEl.classList.add('current');
                }
                wEl.appendChild(cEl);
            }

            // trailing zero-width marker for cursor-at-end-of-word
            const endEl = document.createElement('span');
            endEl.className = 'end';
            if (wi === wordIdx && charIdx >= maxLen && !finished) {
                endEl.classList.add('current');
            }
            wEl.appendChild(endEl);

            wordsWrap.appendChild(wEl);
            wordsWrap.appendChild(document.createTextNode(' '));
        });
        scrollCurrentLineIntoView(wordsWrap);
    }

    function scrollCurrentLineIntoView(container) {
        const wordEls = container.querySelectorAll('.word');
        const active = wordEls[wordIdx];
        if (!active) return;
        const lineH = parseFloat(getComputedStyle(container).lineHeight) || 32;
        const top = active.offsetTop;
        container.scrollTop = Math.max(0, top - lineH);
    }

    function renderSymbols() {
        symbolRow.innerHTML = '';
        for (const ch of currentSeq) {
            const pip = document.createElement('div');
            pip.className = 'sym-pip ' + (ch === '.' ? 'dot' : 'dash');
            symbolRow.appendChild(pip);
        }
    }

    function renderHint() {
        if (!HINTS_ON || finished) { expectedHint.textContent = ''; return; }
        const word = words[wordIdx];
        if (!word) { expectedHint.textContent = ''; return; }
        const ch = word[charIdx];
        if (ch === undefined) {
            expectedHint.innerHTML = `next: <b>space</b>`;
        } else {
            const code = REVERSE_MORSE[ch] || '';
            expectedHint.innerHTML = `${ch.toUpperCase()} <b>${code}</b>`;
        }
    }

    // ── Reading-mode render ──
    const SVG_NS = 'http://www.w3.org/2000/svg';
    function buildWaveSVG(pattern) {
        // visual constants
        const DOT_W = 14;   // dot burst width
        const DASH_W = 36;  // dash burst width
        const GAP_W = 6;    // silence between bursts
        const H = 28;       // svg height
        const AMP = 9;      // wave amplitude
        const CY = H / 2;
        const CYCLES_PER_PX = 0.18; // wave frequency

        let totalW = 0;
        for (let i = 0; i < pattern.length; i++) {
            if (i > 0) totalW += GAP_W;
            totalW += pattern[i] === '.' ? DOT_W : DASH_W;
        }
        if (totalW === 0) totalW = 1;

        let d = '', x = 0;
        for (let i = 0; i < pattern.length; i++) {
            if (i > 0) {
                // flat "silence" segment
                d += `M${x} ${CY}L${x + GAP_W} ${CY}`;
                x += GAP_W;
            }
            const w = pattern[i] === '.' ? DOT_W : DASH_W;
            const steps = Math.max(14, Math.round(w * 1.6));
            d += `M${x} ${CY}`;
            for (let s = 1; s <= steps; s++) {
                const t = s / steps;
                const px = x + t * w;
                // amplitude envelope: 0 at edges, 1 in middle (smooth attack/release)
                const env = Math.sin(Math.PI * t);
                const py = CY - AMP * env * Math.sin(2 * Math.PI * CYCLES_PER_PX * (px - x));
                d += `L${px.toFixed(2)} ${py.toFixed(2)}`;
            }
            x += w;
        }
        // trailing flat tail so the line ends smoothly on the baseline
        d += `M${x} ${CY}L${x + 2} ${CY}`;
        totalW += 2;

        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', `0 0 ${totalW} ${H}`);
        svg.setAttribute('width', totalW);
        svg.setAttribute('height', H);

        const bg = document.createElementNS(SVG_NS, 'path');
        bg.setAttribute('d', d);
        bg.setAttribute('class', 'bg');
        svg.appendChild(bg);

        const fg = document.createElementNS(SVG_NS, 'path');
        fg.setAttribute('d', d);
        fg.setAttribute('class', 'fg');
        svg.appendChild(fg);

        return svg;
    }

    function renderReadingWords() {
        rwordsWrap.innerHTML = '';
        words.forEach((w, wi) => {
            const wEl = document.createElement('span');
            wEl.className = 'rword';
            for (let ci = 0; ci < w.length; ci++) {
                const targetCh = w[ci];
                const typedCh  = (typed[wi] || '')[ci];

                const cEl = document.createElement('span');
                cEl.className = 'rchar';

                // audio waveform
                const wave = document.createElement('span');
                wave.className = 'rwave';
                const pattern = REVERSE_MORSE[targetCh] || '';
                wave.appendChild(buildWaveSVG(pattern));
                cEl.appendChild(wave);

                // letter slot
                const letterEl = document.createElement('span');
                letterEl.className = 'rletter';
                if (typedCh !== undefined) {
                    letterEl.textContent = typedCh;
                }
                cEl.appendChild(letterEl);

                if (typedCh !== undefined) {
                    cEl.classList.add(typedCh === targetCh ? 'correct' : 'incorrect');
                }
                if (wi === wordIdx && ci === charIdx && !finished) {
                    cEl.classList.add('current');
                }
                wEl.appendChild(cEl);
            }
            rwordsWrap.appendChild(wEl);
        });
        // After insertion, compute path length for each fg so dasharray works
        rwordsWrap.querySelectorAll('.rwave path.fg').forEach(p => {
            const len = p.getTotalLength();
            p.style.setProperty('--len', len);
        });
        // scroll current word into view
        const active = rwordsWrap.querySelectorAll('.rword')[wordIdx];
        if (active) {
            const top = active.offsetTop;
            rwordsWrap.scrollTop = Math.max(0, top - 12);
        }
        updateProgress();
    }

    function updateProgress() {
        const word = words[wordIdx];
        if (!word) {
            progressFill.style.width = '0%';
            progressCount.textContent = `${wordIdx} / ${words.length}`;
            return;
        }
        const pct = Math.min(100, (charIdx / word.length) * 100);
        progressFill.classList.remove('reset');
        progressFill.style.width = pct + '%';
        progressCount.textContent = `${wordIdx} / ${words.length}`;
    }

    function resetProgress() {
        progressFill.classList.add('reset');
        progressFill.style.width = '0%';
        // force reflow then re-enable transitions
        progressFill.getBoundingClientRect();
        progressFill.classList.remove('reset');
    }

    // ── Stats / timing ──
    function updateStats() {
        const acc = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
        accDisplay.textContent = acc;
    }

    function startWpm() {
        if (wpmInterval) clearInterval(wpmInterval);
        wpmInterval = setInterval(() => {
            if (!wpmStart) return;
            const mins = (Date.now() - wpmStart) / 60000;
            if (mins <= 0) return;
            wpmDisplay.textContent = Math.round((correctChars / 5) / mins);
        }, 500);
    }

    function resetWpm() {
        wpmStart = null;
        if (wpmInterval) { clearInterval(wpmInterval); wpmInterval = null; }
    }

    function maybeStartTimer() {
        if (!wpmStart) { wpmStart = Date.now(); startWpm(); }
    }

    // ── Shared input ──
    function commitChar(ch) {
        if (finished) return;
        const word = words[wordIdx];
        typed[wordIdx] = (typed[wordIdx] || '') + ch;
        totalChars++;
        if (word[charIdx] === ch) correctChars++;
        charIdx++;
        updateStats();
        render();
    }

    function commitSpace() {
        if (finished) return;
        wordIdx++;
        charIdx = 0;
        if (wordIdx >= words.length) { finishTest(); return; }
        updateStats();
        if (MODE === 'reading') resetProgress();
        render();
        if (MODE === 'reading') playWordAudio(wordIdx);
    }

    function handleBack() {
        if (finished) return;
        if (MODE === 'writing' && currentSeq.length > 0) {
            currentSeq = currentSeq.slice(0, -1);
            renderSymbols();
            if (currentSeq.length === 0 && spaceTimer) { clearTimeout(spaceTimer); spaceTimer = null; }
            else if (currentSeq.length > 0) scheduleSpace();
            return;
        }
        if (typed[wordIdx] && typed[wordIdx].length > 0) {
            const removed = typed[wordIdx].slice(-1);
            const targetCh = words[wordIdx][typed[wordIdx].length - 1];
            typed[wordIdx] = typed[wordIdx].slice(0, -1);
            charIdx = Math.max(0, charIdx - 1);
            totalChars = Math.max(0, totalChars - 1);
            if (removed === targetCh) correctChars = Math.max(0, correctChars - 1);
            updateStats();
            render();
        } else if (wordIdx > 0) {
            wordIdx--;
            charIdx = typed[wordIdx]?.length || 0;
            render();
        }
    }

    function finishTest() {
        finished = true;
        if (spaceTimer) { clearTimeout(spaceTimer); spaceTimer = null; }
        if (wpmInterval) { clearInterval(wpmInterval); wpmInterval = null; }

        const elapsedSec = wpmStart ? (Date.now() - wpmStart) / 1000 : 0;
        const mins = elapsedSec / 60;
        const wpm = mins > 0 ? Math.round((correctChars / 5) / mins) : 0;
        const acc = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 0;

        document.getElementById('r-wpm').textContent = wpm;
        document.getElementById('r-acc').innerHTML = acc + '<small>%</small>';
        document.getElementById('r-time').innerHTML = elapsedSec.toFixed(1) + '<small>s</small>';
        document.getElementById('r-chars').textContent = `${correctChars}/${totalChars}`;

        wpmDisplay.textContent = wpm;
        accDisplay.textContent = acc;

        testPanel.classList.add('finished');
        results.classList.add('show');
    }

    // ── Writing mode: morse key ──
    function decodeSeq() {
        const ch = MORSE[currentSeq];
        commitChar(ch || '?');
        currentSeq = '';
        renderSymbols();
    }

    function scheduleSpace() {
        if (spaceTimer) clearTimeout(spaceTimer);
        spaceTimer = setTimeout(() => {
            if (currentSeq) decodeSeq();
            spaceTimer = setTimeout(() => {
                commitSpace();
            }, Math.max(80, WORD_SPACE - CHAR_SPACE));
        }, CHAR_SPACE);
    }

    function onKeyDown(e) {
        if (MODE !== 'writing' || finished) return;
        if (e?.type === 'touchstart') e.preventDefault();
        if (e?.type === 'keydown' && e.key !== ' ') return;
        if (e?.type === 'keydown') e.preventDefault();
        if (isPressed) return;

        initAudio();
        isPressed = true;
        pressStart = Date.now();
        keyWrap.classList.add('active');
        playBeep();

        if (spaceTimer) { clearTimeout(spaceTimer); spaceTimer = null; }
        maybeStartTimer();
    }

    function onKeyUp(e) {
        if (e?.type === 'keyup' && e.key !== ' ') return;
        if (!isPressed) return;
        if (e?.type === 'touchend') e.preventDefault();

        isPressed = false;
        keyWrap.classList.remove('active');
        stopBeep();

        const duration = Date.now() - pressStart;
        currentSeq += duration < DOT_MS * 1.6 ? '.' : '-';
        renderSymbols();
        scheduleSpace();
    }

    // ── Reading mode: keyboard typing ──
    function onReadingType(letter) {
        if (finished) return;
        maybeStartTimer();
        commitChar(letter);
        // auto-advance to next word when this word's chars are all typed
        if (charIdx >= (words[wordIdx]?.length || 0)) {
            commitSpace();
        }
    }

    // ── Mode switching ──
    function setMode(mode) {
        MODE = mode;
        document.body.dataset.mode = mode;
        modeGroup.querySelectorAll('.seg').forEach(s =>
            s.classList.toggle('active', s.dataset.mode === mode)
        );
        // Hint setting only meaningful in writing mode
        hintRow.style.display = (mode === 'writing') ? '' : 'none';
        stopPlayback();
        buildTest();
    }

    modeGroup.addEventListener('click', async (e) => {
        const t = e.target.closest('.seg');
        if (!t) return;
        const mode = t.dataset.mode;
        setMode(mode);
        if (mode === 'reading') {
            await ensureAudio();
            playWordAudio(0);
        }
    });

    // ── Settings chips ──
    lengthGroup.addEventListener('click', (e) => {
        const t = e.target.closest('.chip');
        if (!t) return;
        lengthGroup.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        t.classList.add('active');
        WORD_COUNT = parseInt(t.dataset.len);
        buildTest();
    });

    hintGroup.addEventListener('click', (e) => {
        const t = e.target.closest('.chip');
        if (!t) return;
        hintGroup.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        t.classList.add('active');
        HINTS_ON = t.dataset.hint === 'on';
        if (MODE === 'writing') renderHint();
    });

    let settingsOpen = false;
    settingsBtn.addEventListener('click', () => {
        settingsOpen = !settingsOpen;
        settingsBtn.classList.toggle('open', settingsOpen);
        settingsDrawer.classList.toggle('open', settingsOpen);
        settingsBtn.setAttribute('aria-expanded', settingsOpen);
        settingsDrawer.setAttribute('aria-hidden', !settingsOpen);
    });

    dotSlider.addEventListener('input', () => {
        DOT_MS = parseInt(dotSlider.value);
        dotVal.textContent = DOT_MS + ' ms';
    });
    charSlider.addEventListener('input', () => {
        CHAR_SPACE = parseInt(charSlider.value);
        charVal.textContent = CHAR_SPACE + ' ms';
    });
    wordSlider.addEventListener('input', () => {
        WORD_SPACE = parseInt(wordSlider.value);
        wordVal.textContent = WORD_SPACE + ' ms';
    });

    // ── Wire events ──
    keyBtn.addEventListener('mousedown', onKeyDown);
    keyBtn.addEventListener('touchstart', onKeyDown, { passive: false });
    window.addEventListener('mouseup', onKeyUp);
    window.addEventListener('touchend', onKeyUp, { passive: false });

    window.addEventListener('keydown', e => {
        if (e.key === 'Tab') { e.preventDefault(); buildTest(); return; }
        if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); handleBack(); return; }

        if (MODE === 'writing') {
            if (e.key === ' ') onKeyDown(e);
            return;
        }

        // Reading mode: letter keys + space
        if (e.key === ' ') {
            e.preventDefault();
            maybeStartTimer();
            commitSpace();
            return;
        }
        if (/^[a-zA-Z]$/.test(e.key)) {
            e.preventDefault();
            onReadingType(e.key.toLowerCase());
        }
    });
    window.addEventListener('keyup', onKeyUp);

    function doBack(e) { e.preventDefault(); handleBack(); }
    function doRestart(e) { e?.preventDefault(); buildTest(); }

    restartBtn.addEventListener('click', doRestart);
    restartBtn.addEventListener('touchend', doRestart, { passive: false });
    backBtn.addEventListener('click', doBack);
    backBtn.addEventListener('touchend', doBack, { passive: false });

    async function doReplay(e) {
        e?.preventDefault();
        await ensureAudio();
        playWordAudio(wordIdx);
    }
    replayBtn.addEventListener('click', doReplay);
    replayBtn.addEventListener('touchend', doReplay, { passive: false });

    // ── Boot ──
    setMode('writing');
</script>
</body>
</html>
